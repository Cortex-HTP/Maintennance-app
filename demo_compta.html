function toPascalCase(s) { return s.split("-").map(function(p) { return p.charAt(0).toUpperCase() + p.slice(1); }).join(""); }
function Icon({ name, size = 16, color = "currentColor", style }) {
  const ref = useRef(null);
  useEffect(function() {
    if (!ref.current) return;
    ref.current.innerHTML = "";
    try {
      const pascal = toPascalCase(name);
      const svgStr = window.lucide && (window.lucide.icons[pascal] || window.lucide.icons[name]);
      if (svgStr) {
        const tmp = document.createElement("div");
        tmp.innerHTML = window.lucide.createElement(svgStr).outerHTML;
        const svg = tmp.firstChild;
        svg.setAttribute("width", String(size));
        svg.setAttribute("height", String(size));
        svg.setAttribute("stroke", color);
        svg.style.display = "inline-block";
        svg.style.verticalAlign = "middle";
        svg.style.flexShrink = "0";
        ref.current.appendChild(svg);
      }
    } catch (e) {}
  }, [name, size, color]);
  return h("span", { ref: ref, style: Object.assign({ display: "inline-flex", alignItems: "center", lineHeight: 0 }, style || {}) });
}

function fmtXPF(v) { if (v == null) return "—"; return Math.round(v).toLocaleString("fr-FR") + " XPF"; }
function fmtNum(v) { if (v == null) return "0"; return Math.round(v).toLocaleString("fr-FR"); }
function fmtDate(s) {
  if (!s) return "—";
  try {
    const d = new Date(s);
    return d.toLocaleDateString("fr-FR", { day: "2-digit", month: "short", year: "numeric" });
  } catch (e) { return s; }
}
function fmtDateShort(s) {
  if (!s) return "—";
  try {
    const d = new Date(s);
    return d.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" });
  } catch (e) { return s; }
}
function compactMF(v) {
  if (v == null) return "—";
  if (v >= 1000000) return (v / 1000000).toFixed(2) + " MF";
  return Math.round(v / 1000) + " k";
}

  const color = v === "secondary" ? "#cbd5e1" : "#ffffff";

  return h("button", {
    onClick: onClick,
    disabled: disabled,
    style: Object.assign({
      padding: "9px 16px",
      borderRadius: 8,

      color: color,

function EcranAccueil({ factures, transmissions, onNav }) {
  const today = new Date(2026, 5, 15);
  const nouvelles = factures.filter(function(f) { return f.statut === "nouvelle"; });
  const aCompleter = factures.filter(function(f) { return f.statut === "a_completer"; });
  const validees = factures.filter(function(f) { return f.statut === "validee"; });
  const mois = today.getMonth();
  const annee = today.getFullYear();
  const transmisesMois = factures.filter(function(f) {
    const d = new Date(f.dateFacture);
    return f.statut === "transmise" && d.getMonth() === mois && d.getFullYear() === annee;
  });
  const totalAttente = nouvelles.concat(aCompleter, validees).reduce(function(s, f) { return s + f.ht; }, 0);
  const totalTransMois = transmisesMois.reduce(function(s, f) { return s + f.ht; }, 0);
  const enRetardPaiement = factures.filter(function(f) {
    const ech = new Date(f.echeance);
    return !f.paye && ech < today;
  });

  // Recap par categorie sur 90j
  const cat90 = {};
  factures.forEach(function(f) {
    const d = new Date(f.dateFacture);
    const daysAgo = (today - d) / 86400000;
    if (daysAgo > 90) return;
    cat90[f.categorie] = (cat90[f.categorie] || 0) + f.ht;
  });
  const catSorted = Object.keys(cat90).map(function(k) {
    return { key: k, total: cat90[k], info: CATEGORIES.find(function(c) { return c.key === k; }) };
  }).sort(function(a, b) { return b.total - a.total; });
  const maxCat = catSorted.length > 0 ? catSorted[0].total : 1;

  // Activite recente : 5 dernieres factures (toutes statuts)
  const recentes = factures.slice().sort(function(a, b) { return new Date(b.dateReception) - new Date(a.dateReception); }).slice(0, 6);

  return h("div", null,
    h("div", { style: { marginBottom: 20 } },
      h("h1", { style: { margin: 0, fontSize: 24, fontWeight: 800, letterSpacing: "-0.02em" } }, "Bonjour Sophie"),
      h("div", { style: { fontSize: 13.5, color: "#94a3b8", marginTop: 4 } }, today.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" }))

// ─── Ecran : Validees (a transmettre) ──────────────────────────────────
function EcranValidees({ factures, onTransmettre, showToast }) {
  const _selectedHook = useState({}); const selected = _selectedHook[0]; const setSelected = _selectedHook[1];
  const _showTransmHook = useState(false); const showTransm = _showTransmHook[0]; const setShowTransm = _showTransmHook[1];

  const validees = factures.filter(function(f) { return f.statut === "validee"; }).sort(function(a, b) { return new Date(a.dateFacture) - new Date(b.dateFacture); });
  const nbSel = Object.keys(selected).filter(function(k) { return selected[k]; }).length;
  const totalSel = validees.filter(function(f) { return selected[f.id]; }).reduce(function(s, f) { return s + f.ht; }, 0);

  // Groupe par mois
  const groupes = {};
  validees.forEach(function(f) {
    const k = f.dateFacture.substring(0, 7); // YYYY-MM
    if (!groupes[k]) groupes[k] = [];
    groupes[k].push(f);
  });
  const groupesArr = Object.keys(groupes).sort(function(a, b) { return a < b ? -1 : 1; }).map(function(k) {
    return { mois: k, factures: groupes[k], total: groupes[k].reduce(function(s, f) { return s + f.ht; }, 0) };
  });

  function toggleAll(groupe) {
    const allSel = groupe.factures.every(function(f) { return selected[f.id]; });
    const next = Object.assign({}, selected);
    groupe.factures.forEach(function(f) { next[f.id] = !allSel; });
    setSelected(next);
  }
  function toggleOne(id) {
    setSelected(Object.assign({}, selected, { [id]: !selected[id] }));
  }
  function selectAllMonth(mois) {
    const grp = groupes[mois];
    const next = Object.assign({}, selected);
    grp.forEach(function(f) { next[f.id] = true; });
    setSelected(next);
  }

  return h("div", null,
    h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18, flexWrap: "wrap", gap: 12 } },
      h("div", null,
        h("h1", { style: { margin: 0, fontSize: 22, fontWeight: 800 } }, "Factures validees"),
        h("div", { style: { fontSize: 12.5, color: "#94a3b8", marginTop: 4 } }, "Pretes a etre transmises au cabinet comptable")
      ),
      nbSel > 0 ? h(Button, { variant: "success", onClick: function() { setShowTransm(true); } },
        h(Icon, { name: "send", size: 14, color: "#fff" }),
        "Transmettre " + nbSel + " facture(s) - " + fmtXPF(totalSel)
      ) : null
    ),
    validees.length === 0 ?
      h(GlassCard, { style: { padding: 60, textAlign: "center" } },
        h(Icon, { name: "check-circle", size: 48, color: "rgba(34,197,94,0.30)" }),
        h("div", { style: { marginTop: 14, fontSize: 14, fontWeight: 700, color: "#cbd5e1" } }, "Tout est a jour !"),
        h("div", { style: { marginTop: 4, fontSize: 12, color: "#94a3b8" } }, "Aucune facture validee en attente de transmission")
      ) :
      h("div", { style: { display: "flex", flexDirection: "column", gap: 14 } },
        groupesArr.map(function(g) {
          const [a, m] = g.mois.split("-");
          const moisLib = new Date(parseInt(a), parseInt(m) - 1, 1).toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
          const allSel = g.factures.every(function(f) { return selected[f.id]; });
          return h(GlassCard, { key: g.mois, style: { padding: 0, overflow: "hidden" } },
            h("div", { style: { padding: "14px 18px", display: "flex", alignItems: "center", gap: 12, background: "linear-gradient(135deg, rgba(99,102,241,0.10), rgba(139,92,246,0.05))", borderBottom: "1px solid rgba(255,255,255,0.06)" } },
              h("input", { type: "checkbox", checked: allSel, onChange: function() { toggleAll(g); }, style: { width: 18, height: 18, accentColor: "#22c55e" } }),
              h("div", { style: { flex: 1 } },
                h("div", { style: { fontSize: 14, fontWeight: 800, color: "#fafafa", textTransform: "capitalize" } }, moisLib),
                h("div", { style: { fontSize: 11.5, color: "#a1a1aa", marginTop: 2 } }, g.factures.length + " facture(s) validee(s)")
              ),
              h("div", { style: { textAlign: "right" } },
                h("div", { style: { fontSize: 16, fontWeight: 800, color: "#fafafa", fontFamily: "monospace" } }, fmtXPF(g.total)),
                h("div", { style: { fontSize: 11, color: "#a1a1aa", marginTop: 2 } }, "Total HT")
              ),
              h(Button, { variant: "secondary", onClick: function() { selectAllMonth(g.mois); } }, h(Icon, { name: "check-square", size: 12, color: "#cbd5e1" }), "Tout selectionner")
            ),
            h("div", null,
              g.factures.map(function(f) {
                const four = FOURNISSEURS.find(function(x) { return x.id === f.fournisseurId; });
                const cat = CATEGORIES.find(function(x) { return x.key === f.categorie; });
                const chantier = CHANTIERS.find(function(x) { return x.id === f.chantierId; });
                const isSel = !!selected[f.id];
                return h("div", { key: f.id, onClick: function() { toggleOne(f.id); }, style: { padding: "10px 18px", display: "flex", alignItems: "center", gap: 12, cursor: "pointer", borderTop: "1px solid rgba(255,255,255,0.04)", background: isSel ? "rgba(34,197,94,0.06)" : "transparent" } },
                  h("input", { type: "checkbox", checked: isSel, onChange: function() {}, style: { width: 16, height: 16, accentColor: "#22c55e" } }),
                  h("div", { style: { width: 28, height: 28, borderRadius: 7, background: cat.color + "20", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 } },
                    h(Icon, { name: cat.icon, size: 13, color: cat.color })
                  ),
                  h("div", { style: { flex: 1, minWidth: 0 } },
                    h("div", { style: { fontSize: 13, fontWeight: 600, color: "#fafafa", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" } }, four.nom + " - " + f.libelle),
                    h("div", { style: { fontSize: 11, color: "#94a3b8", marginTop: 2 } },
                      f.reference + " - " + fmtDate(f.dateFacture) + (chantier ? " - " + chantier.nom : "")
                    )
                  ),
                  h("div", { style: { fontSize: 13.5, fontWeight: 700, color: "#fafafa", fontFamily: "monospace" } }, fmtXPF(f.ht))
                );
              })
            )
          );
        })
      ),
    showTransm ? h(ModalTransmission, { factures: validees.filter(function(f) { return selected[f.id]; }), onClose: function() { setShowTransm(false); }, onSend: function() {
      onTransmettre(Object.keys(selected).filter(function(k) { return selected[k]; }).map(function(k) { return parseInt(k); }));
      setSelected({});
      setShowTransm(false);
      showToast("Transmission envoyee ! Email recapitulatif envoye au cabinet.", "success");
    } }) : null
  );
}

    flexShrink: 0
  } },
    h("div", { style: { padding: "20px 16px" } },
      h("div", { style: { display: "flex", alignItems: "center", gap: 12 } },
        h("div", { style: { width: 38, height: 38, borderRadius: 10, background: "linear-gradient(135deg, #22c55e, #16a34a)", display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontWeight: 800, fontSize: 16, boxShadow: "0 4px 14px rgba(34,197,94,0.35)" } },
          h(Icon, { name: "file-text", size: 18, color: "#fff" })
        ),
        h("div", null,
          h("div", { style: { fontSize: 15, fontWeight: 700, letterSpacing: "-0.01em" } }, "Compta"),
          h("div", { style: { fontSize: 11.5, color: "#71717a", marginTop: 1 } }, "Wallis-Label SARL")
        )
      )
    ),
    h("nav", { style: { flex: 1, padding: "8px 8px 16px", overflowY: "auto" } },
      items.map(function(item) {
        const active = currentPage === item.key;
        return h("button", { key: item.key, onClick: function() { onNav(item.key); },
          style: { display: "flex", alignItems: "center", gap: 12, width: "100%", padding: "10px 14px", border: "none", borderRadius: 9, marginBottom: 3, cursor: "pointer", fontSize: 13.5, fontWeight: active ? 700 : 500, background: active ? "linear-gradient(135deg, rgba(129,140,248,0.18), rgba(192,132,252,0.08))" : "transparent", color: active ? "#e0e7ff" : "#cbd5e1", boxShadow: active ? "inset 0 0 0 1px rgba(129,140,248,0.30)" : "none", textAlign: "left", fontFamily: "inherit" },
          onMouseEnter: function(e) { if (!active) e.currentTarget.style.background = "rgba(255,255,255,0.05)"; },
          onMouseLeave: function(e) { if (!active) e.currentTarget.style.background = "transparent"; }
        },
          h(Icon, { name: item.icon, size: 16, color: active ? "#a5b4fc" : "#94a3b8" }),
          h("span", { style: { flex: 1 } }, item.label),
          item.badge ? h("span", { style: { background: "linear-gradient(135deg, " + item.badgeColor + ", " + item.badgeColor + ")", color: "#1a1530", fontSize: 10.5, fontWeight: 800, padding: "2px 7px", borderRadius: 999, minWidth: 20, textAlign: "center" } }, item.badge) : null
        );
      })
    ),
    h("div", { style: { padding: "12px 16px", borderTop: "1px solid rgba(255,255,255,0.06)" } },
      h("div", { style: { display: "flex", alignItems: "center", gap: 10, marginBottom: 8 } },
        h("div", { style: { width: 28, height: 28, borderRadius: "50%", background: "linear-gradient(135deg, #6366f1, #8b5cf6)", display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontSize: 11, fontWeight: 800 } }, "S"),
        h("div", { style: { flex: 1, minWidth: 0 } },
          h("div", { style: { fontSize: 12, color: "#fafafa", fontWeight: 700, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" } }, "Sophie"),

        )
      ),
      h("button", { style: { width: "100%", padding: "7px 12px", background: "rgba(255,255,255,0.04)", color: "#cbd5e1", border: "1px solid rgba(255,255,255,0.07)", borderRadius: 7, cursor: "pointer", fontSize: 12, fontWeight: 600, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, fontFamily: "inherit" } },
        h(Icon, { name: "log-out", size: 12, color: "#cbd5e1" }), "Deconnexion")
    )
  );
}

// ─── App principale ────────────────────────────────────────────────────
function Toast({ message, type }) {
  if (!message) return null;
  const bg = type === "success" ? "linear-gradient(135deg, #22c55e, #16a34a)"
        : type === "info" ? "linear-gradient(135deg, #6366f1, #818cf8)"
        : "linear-gradient(135deg, #f43f5e, #e11d48)";
  return h("div", { style: { position: "fixed", bottom: 24, right: 24, padding: "12px 18px", background: bg, color: "#fff", borderRadius: 10, fontSize: 13, fontWeight: 700, boxShadow: "0 12px 30px rgba(0,0,0,0.4)", zIndex: 200, display: "flex", alignItems: "center", gap: 8 }, className: "anim-fade-in" },
    h(Icon, { name: type === "success" ? "check-circle" : "info", size: 15, color: "#fff" }),
    message
  );
}

function App() {
  const _pageHook = useState("accueil"); const page = _pageHook[0]; const setPage = _pageHook[1];
  const _facturesHook = useState(FACTURES_INIT); const factures = _facturesHook[0]; const setFactures = _facturesHook[1];
  const _transmHook = useState(TRANSMISSIONS_INIT); const transmissions = _transmHook[0]; const setTransmissions = _transmHook[1];
  const _toastHook = useState({ message: "", type: "success" }); const toast = _toastHook[0]; const setToast = _toastHook[1];

  function showToast(message, type) {
    setToast({ message: message, type: type || "success" });
    setTimeout(function() { setToast({ message: "", type: type || "success" }); }, 3500);
  }

  function updateFacture(id, updates) {
    setFactures(factures.map(function(f) { return f.id === id ? Object.assign({}, f, updates) : f; }));
  }

  function transmettre(ids) {
    const concernees = factures.filter(function(f) { return ids.indexOf(f.id) >= 0; });
    const total = concernees.reduce(function(s, f) { return s + f.ht; }, 0);
    const newTransm = {
      id: transmissions.length + 1,
      dateEnvoi: new Date(2026, 5, 15).toISOString().substring(0, 10),
      lot: "T2026-06",
      nbFactures: concernees.length,
      totalHT: total,
      destinataire: "comptable@cabinet-dupond.nc",
      statut: "envoyee",
      fichierZip: "transmission_2026-06.zip"
    };
    setTransmissions([newTransm].concat(transmissions));
    setFactures(factures.map(function(f) { return ids.indexOf(f.id) >= 0 ? Object.assign({}, f, { statut: "transmise" }) : f; }));
  }

  return h("div", { style: { display: "flex", height: "100vh", paddingTop: 32 } },
    h(Sidebar, { currentPage: page, onNav: setPage, factures: factures }),
    h("div", { style: { flex: 1, overflowY: "auto", padding: "28px 32px" } },
      page === "accueil" ? h(EcranAccueil, { factures: factures, transmissions: transmissions, onNav: setPage }) :
      page === "inbox" ? h(EcranInbox, { factures: factures, onChange: updateFacture, showToast: showToast }) :
      page === "validees" ? h(EcranValidees, { factures: factures, onTransmettre: transmettre, showToast: showToast }) :
      page === "transmissions" ? h(EcranTransmissions, { transmissions: transmissions }) :
      page === "parametres" ? h(EcranParametres, null) :
      null
    ),
    h(Toast, { message: toast.message, type: toast.type })
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
